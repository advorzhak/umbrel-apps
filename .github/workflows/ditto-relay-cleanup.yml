name: Clean ditto-relay package versions

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/ditto-relay-cleanup.yml"

permissions:
  contents: read
  packages: write

env:
  PACKAGE: ditto-relay

jobs:
  clean:
    name: Keep only the tagged image version
    runs-on: ubuntu-latest
    steps:
      - name: Delete older package versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_VERSIONS: "12"
        run: |
          set -euo pipefail
          versions=$(gh api --paginate --slurp "/user/packages/container/${PACKAGE}/versions?per_page=100")
          total=$(echo "$versions" | jq 'add | length')
          echo "Found $total package versions"
          if [ "$total" -le "$KEEP_VERSIONS" ]; then
            echo "Nothing to delete."
            exit 0
          fi
          echo "$versions" | jq -r --argjson keep "$KEEP_VERSIONS" '
            add
            | sort_by(.created_at)
            | .[:($total - $keep)]
            | .[]
            | .id
          ' | while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting version $id"
            gh api -X DELETE "/user/packages/container/${PACKAGE}/versions/${id}" || echo "Failed to delete $id"
          done
          echo "Done."
